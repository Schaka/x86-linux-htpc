# The Android apps that the component android-apps can install. ANDROID_APPS
# in the configuration file selects them by NAME.
#
# NAME  ANDROID_PACKAGE  GITHUB_REPOSITORY  ASSET_PATTERN  TITLE
#
# The newest release of the repository with a matching asset wins, also a
# beta release. SmartTube publishes only beta releases on GitHub, and the
# beta has its own package name.
smarttube org.smarttube.beta yuliskov/SmartTube ^SmartTube_.*_universal\.apk$ SmartTube
# TizenTube Cobalt has only ARM builds. The Android TV image translates
# them with libhoudini.
tizentube io.gh.reisxd.tizentube.cobalt reisxd/TizenTubeCobalt ^cobalt-arm64\.apk$ TizenTube
# S0undTV puts each beta build into its release "beta", and the stable
# releases are older. The app updates itself after the first install.
s0undtv com.s0und.s0undtv S0und/S0undTV ^(beta_[0-9]+|S0undTV_.*_standalone)\.apk$ Twitch
