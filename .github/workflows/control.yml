# SPDX-License-Identifier: AGPL-3.0-only
#
# Builds htpc-control, the program of the component control-api, as a
# static x86-64 program with its OpenAPI document. Each run keeps both as
# build artifacts. A tag v* also attaches them to the GitHub release, where
# the component control-api downloads them.
name: control

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["control/**", ".github/workflows/control.yml"]
  pull_request:
    paths: ["control/**", ".github/workflows/control.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add "${TARGET}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            control/target
          key: cargo-${{ hashFiles('control/Cargo.lock') }}

      - name: Check the format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target "${TARGET}"

      - name: Collect the files
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/htpc-control" dist/htpc-control-x86_64-linux
          ./dist/htpc-control-x86_64-linux openapi > dist/openapi.yaml
          cd dist
          sha256sum htpc-control-x86_64-linux > htpc-control-x86_64-linux.sha256
          sha256sum openapi.yaml > openapi.yaml.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: htpc-control
          path: control/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: htpc-control
          path: dist

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
